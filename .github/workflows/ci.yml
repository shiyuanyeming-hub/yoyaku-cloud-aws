name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t yoyaku-cloud .
      - name: Container smoke test
        run: |
          docker run -d --name yoyaku-smoke -p 127.0.0.1:8766:8000 yoyaku-cloud
          trap 'docker logs yoyaku-smoke; docker rm -f yoyaku-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/health; then exit 0; fi
            sleep 1
          done
          exit 1
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yoyaku
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yoyaku
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoyaku"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_postgres.py
        env:
          TEST_DATABASE_URL: postgresql://yoyaku:ci-only-password@localhost:5432/yoyaku
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
