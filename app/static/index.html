<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yoyaku Cloud | 予約管理</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c3542;background:#f2f6f7}*{box-sizing:border-box}body{margin:0}header{background:#153e4c;color:white;padding:20px max(5vw,24px);display:flex;justify-content:space-between;align-items:center}header strong{letter-spacing:.08em}header span{font-size:12px;color:#b6d8dc}main{max-width:1120px;margin:auto;padding:48px 24px}.eyebrow{color:#087d7e;font-size:12px;letter-spacing:.12em;font-weight:700}h1{font-size:clamp(28px,4vw,42px);margin:10px 0}p{color:#617780;line-height:1.7}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;margin-top:30px}.card{background:white;border:1px solid #dbe8e9;border-radius:16px;padding:28px;box-shadow:0 8px 24px #173d4c0a}h2{font-size:19px;margin:0 0 18px}label{display:block;margin:16px 0 8px;font-size:13px;font-weight:700}input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #cbdcde;background:white}input,select{width:100%}button{cursor:pointer}.primary{background:#087b7e;color:white;border:0;width:100%;font-weight:bold;margin-top:20px}.primary:disabled{background:#b8c9cb;cursor:not-allowed}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{color:#116f70;background:#f2fbfa;border-color:#cbe3e0}.slot.selected{background:#087b7e;color:white}.slot:disabled{color:#a2b2b4;background:#edf1f2;cursor:not-allowed;text-decoration:line-through}.small{font-size:12px;color:#71888e}.message{margin-top:15px;padding:12px;border-radius:8px;background:#e5f4f1;color:#146e61}.message.error{background:#fff0ed;color:#a13b2b}.reservation{padding:16px 0;border-top:1px solid #e5eeee;display:flex;justify-content:space-between;gap:10px;align-items:center}.reservation b{display:block}.reservation small{color:#788b90;overflow-wrap:anywhere}.cancel{font-size:12px;color:#a13b2b;background:#fff;border:1px solid #eed1cb;white-space:nowrap}.empty{font-size:14px;color:#71888e;margin-top:24px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#e0f3ed;color:#16685b;font-size:12px;font-weight:bold}footer{padding:30px 0;color:#71888e;font-size:12px}a{color:#087b7e}@media(max-width:720px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}header span{display:none}}
</style></head><body><header><strong>YOYAKU CLOUD</strong><span>RESERVATION MANAGEMENT / DEMO</span></header><main><div class="eyebrow">PORTFOLIO DEMO · ASIA/TOKYO</div><h1>予約状況を、ひと目で。</h1><p>空き時間の確認から予約・キャンセルまで試せる、店舗向け予約システムのデモです。</p><div class="grid"><section class="card"><h2>空き枠から予約</h2><div class="fields"><div><label for="resource">拠点</label><select id="resource"><option value="tokyo-room">東京ルーム</option><option value="osaka-room">大阪ルーム</option></select></div><div><label for="date">日付（日本時間）</label><input id="date" type="date"></div></div><label>空き時間 <span class="small">09:00–18:00 / 1時間単位</span></label><div id="slots" class="slots" aria-live="polite"></div><label for="customer">お名前（デモ用）</label><input id="customer" maxlength="100" placeholder="例：テスト太郎"><button id="book" class="primary" disabled>時間を選択してください</button><div id="message" class="message" role="status" hidden></div><p class="small">デモ環境です。実際の個人情報は入力しないでください。</p></section><section class="card"><span class="pill">予約管理</span><h2 style="margin-top:18px">この日の予約</h2><p class="small">選択した拠点と日付の予約を表示します。</p><div id="list" aria-live="polite"></div><p class="small">キャンセルすると、その時間枠は再び予約可能になります。</p></section></div><footer>個人開発のデモ · 実際の予約は行われません · <a href="/docs">API ドキュメント</a></footer></main><script>
const resource=document.querySelector('#resource'), day=document.querySelector('#date'), customer=document.querySelector('#customer'), slots=document.querySelector('#slots'), list=document.querySelector('#list'), book=document.querySelector('#book'), message=document.querySelector('#message');let selected=null;
const jstDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());day.value=jstDate;
function notice(text,error=false){message.hidden=false;message.className=error?'message error':'message';message.textContent=text}
function updateButton(){book.disabled=!selected;book.textContent=selected?`${selected.slice(11,16)} を予約する`:'時間を選択してください'}
async function refresh(){selected=null;updateButton();slots.textContent='読み込み中…';list.textContent='読み込み中…';const params=new URLSearchParams({resource:resource.value,date:day.value});try{const [a,b]=await Promise.all([fetch('/availability?'+params),fetch('/reservations?'+params)]);if(!a.ok||!b.ok)throw Error();const availability=await a.json(), reservations=await b.json();slots.replaceChildren();for(const item of availability.slots){const btn=document.createElement('button');btn.className='slot';btn.type='button';btn.textContent=item.starts_at.slice(11,16);btn.disabled=!item.available;btn.setAttribute('aria-label',btn.textContent+(item.available?' 空き':' 予約済み'));btn.addEventListener('click',()=>{selected=item.starts_at;slots.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');updateButton()});slots.append(btn)}list.replaceChildren();if(!reservations.length){const p=document.createElement('p');p.className='empty';p.textContent='この日の予約はありません。';list.append(p)}for(const entry of reservations){const row=document.createElement('div');row.className='reservation';const text=document.createElement('div'),title=document.createElement('b'),id=document.createElement('small');title.textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date(entry.starts_at))+'　'+entry.customer;id.textContent='予約 ID: '+entry.id;text.append(title,id);const cancel=document.createElement('button');cancel.className='cancel';cancel.textContent='キャンセル';cancel.addEventListener('click',async()=>{try{const response=await fetch('/reservations/'+encodeURIComponent(entry.id),{method:'DELETE'});if(!response.ok)throw Error();notice('予約をキャンセルしました。');await refresh()}catch{notice('キャンセルできませんでした。',true)}});row.append(text,cancel);list.append(row)}}catch{slots.textContent='読み込めませんでした。';list.textContent='接続を確認してください。';notice('データを取得できませんでした。',true)}}
resource.addEventListener('change',refresh);day.addEventListener('change',()=>{if(day.value)refresh()});book.addEventListener('click',async()=>{if(!customer.value.trim()){notice('デモ用のお名前を入力してください。',true);return}book.disabled=true;try{const response=await fetch('/reservations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource:resource.value,customer:customer.value,starts_at:selected})});if(response.status===409){notice('この時間枠はすでに予約されています。',true);await refresh();return}if(!response.ok)throw Error();notice('予約を受け付けました。');customer.value='';await refresh()}catch{notice('予約できませんでした。',true);updateButton()}});refresh();
</script></body></html>
